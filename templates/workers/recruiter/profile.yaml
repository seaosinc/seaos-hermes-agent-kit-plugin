# このワーカーの定義。seaos-kit update が ~/.hermes へ反映する。
name: recruiter

# decomposer はこの説明文を読んで子カードの担当を決める。
# 「完了条件が〜で終わるタスクはここへ」と書くと判別しやすい。
description: >-
  エージェント（業務別ワーカー）そのものを新設・改修・撤去する役。
  何に責任を持つ役かを決め、SOUL と説明文を書き、必要なスキル・MCP・作業環境を
  用意してキットへ反映し、動作確認までを行う。
  例:「請求書チェック専門のワーカーを作る」「既存ワーカーの担当範囲を広げる」
  「あるワーカーに専用スキルを持たせる」「使わなくなったワーカーを撤去する」
  「ある役の構成ではその仕事ができないので、道具を足して作り直す」。
  【重要】**担当できる役が見当たらない依頼が来たら、まずここへ。**
  受け皿になる汎用の役は置いていないので、「合う役がいない」はそのまま
  「役が足りない」という事実である。まず役を起こしてから、その役に仕事を渡す。
  完了条件が『〜というワーカーが作られ、カードが割り当てられる』
  『〜の担当範囲が変わっている』で終わるタスクはここへ。
  エージェントの構成そのものが対象で、通常の業務調査や実装は扱わない。

# **人が読む一行。** 設定画面の一覧に出る（description は decomposer 向けの長文）。
summary: "エージェントそのものを新設・改修する"

# **中間（mid）を充てる。** この役の仕事は「どんな役が要るかを決め、description を
# 書く」ことで、書いた文章が decomposer の振り分けをそのまま左右する。安い模型では
# 担当範囲の切り方が粗く、既存の役と重なる役や、誰も引けない説明文ができた（実測）。
# **ここは出来の悪さが、作った役の数だけ後から効いてくる。**
#
# fast / mid / smart / senior と書けば、MODEL_MID などの差し替えに追従する。
# 生のモデル名を書いて固定することもできる。空なら fast。
model: "mid"

# SOUL.md の {{EXTRA}} に差し込まれる業務固有の指示（省略可）
extra: ""

# **リポジトリを clone しない。** 触るのは templates/ とプロファイルなので、
# 作業部屋の規約（clone → push）も委譲のスキルも要らない。
implements: false
