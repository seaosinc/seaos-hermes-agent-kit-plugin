# **役を新しく作るときの雛形。** これ自体は配られない（`_` 始まりは役として扱われない）。
#   seaos-kit worker new <名前> --desc "..." で、ここを元に作られる。
#
# 「何でもやる役」を本番に置かないこと。役割が決まらないと、注入するモデルも、
# 与える道具も、用意する作業環境も選べない——構成が全部曖昧になる。
name: _template

# decomposer はこの説明文を読んで子カードの担当を決める。
# 「完了条件が〜で終わるタスクはここへ」と書くと判別しやすい。
# decomposer はこの説明文だけを見て担当を決める。
# **何に責任を持つ役か**を書く。「〜が分かっている」「〜が動く」のように、
# 完了条件の形まで書くと振り分けが安定する。
description: >-
  （この役が何に責任を持つかを1〜3文で。例と、完了条件の形を添える）

# **人が読む一行。** 設定画面の一覧に出る。
# description は decomposer 向けの長文なので、そのまま出すと切れて読めない。
# 「何をする役か」を20〜30字で。体言止めでよい。
summary: ""

# 空なら MODEL_FAST（既定 openai/gpt-5.6-luna）が使われる。
# 特定のモデルを固定したいときだけ書く。
model: ""

# SOUL.md の {{EXTRA}} に差し込まれる業務固有の指示（省略可）
extra: ""
