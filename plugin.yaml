# Hermes ネイティブプラグインのマニフェスト。
# **このリポジトリ全体が1つのプラグインである。** 役の定義（templates/）も
# 生成器（core/）も GUI（desktop/）も、この1フォルダで入り、1フォルダで消える。
# **v1 で書く。** ローダ（plugins.py）は v2 を読めるが、**インストーラ
# （plugins_cmd.py の _SUPPORTED_MANIFEST_VERSION）が 1 までしか受け付けない。**
# v2 を宣言すると install の時点で弾かれる。入口に合わせること。
manifest_version: 1
# **名前はリポジトリ名と同じにする。** `hermes plugins install <GitHub の URL>` はリポジトリ名で
# フォルダを作り、`plugins enable` はフォルダ名で有効を記録する。一方、設定画面の
# バックエンドを通すかどうかは、ここ（と dashboard/manifest.json）の名前で判定する。
# ずれていると、README どおりに入れた環境で画面が「Plugin not found」になった。
name: seaos-hermes-agent-kit-plugin
# **プラグインとしての版。** ここは滅多に動かさない。配る役の版は git から採っていて
# （`0.1.<コミット数>+<sha>`）、更新が届いたかはそちらで判定する。この数字を見て
# 何かが決まる場面は無いので、コミットのたびに機械が書き換えることはしない。
version: 1.0.0
description: SEAOS のエージェント役一式を、GUI から導入・更新・検査するキット
author: seaos

# 役が使う鍵。**値はここに書かない。** 画面か CLI から受け取り、キットの .env に置く。
requires_env:
  - OPENROUTER_API_KEY
optional_env:
  - GH_TOKEN
  - BACKLOG_DOMAIN
  - BACKLOG_API_KEY
  - NOTION_TOKEN
  - SLACK_BOT_TOKEN
  - SLACK_APP_TOKEN

platforms:
  - darwin
  - linux
  - win32

# 生成器が使う。v1 の語彙で書く（python_dependencies は v2 のフィールド）。
pip_dependencies:
  - pyyaml
